name: Tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: install package with test extras (Plone 6.1)
        run: pip install -e ".[test]" -c "https://dist.plone.org/release/6.1-dev/constraints.txt"

      - name: run tests
        run: zope-testrunner --test-path=. -s collective.limitfilesizepanel --all
