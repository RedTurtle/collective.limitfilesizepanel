# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[tox]
# Support Plone 6.0, 6.1 and 6.2 (Python 3.11+) only.
test_matrix = {"6.2" = ["3.14", "3.13", "3.12", "3.11"], "6.1" = ["3.13", "3.12", "3.11"], "6.0" = ["3.13", "3.12", "3.11"]}
# NOTE: plone.meta adds "rfbrowser init chromium" to the test/coverage commands
# because setup.py mentions plone.app.robotframework (needed only because
# plone.app.contenttypes.testing imports it). There are no .robot tests here,
# so those lines have been removed by hand from tox.ini: remove them again
# after any future `config-package` regeneration.

[pyproject]
# .coveragerc is used by the coverage tox env but doesn't need to ship in the sdist.
check_manifest_ignores = """
    ".coveragerc",
"""

[github]
# "dependencies" is disabled: z3c.dependencychecker wants every imported
# package (Zope, Products.CMFCore, zope.*, ...) declared in install_requires,
# while here we rely on Plone to pull them in.
jobs = [
    "qa",
    "coverage",
    "release_ready",
    "circular",
    ]
